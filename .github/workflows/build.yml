name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PlanMeter.sln

      - name: Build
        run: dotnet build PlanMeter.sln -c Release --no-restore

      - name: Test
        shell: cmd
        run: dotnet test tests\PlanMeter.Core.Tests\PlanMeter.Core.Tests.csproj -c Release --no-build --filter Category!=Dogfood

      - name: Publish
        run: >
          dotnet publish src/PlanMeter.App/PlanMeter.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: PlanMeter
          path: artifacts/PlanMeter.App.exe

      - name: Copy release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: Copy-Item artifacts/PlanMeter.App.exe artifacts/PlanMeter.exe

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/PlanMeter.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
